name: "Tricorder Diagnostic Station"
description: "XPRIZE-Inspired Biometric Scanner for the Antigravity Platform"
type: "particle"
icon: "fa-heartbeat"
configuration:
  caching:
    type: "static"
  fields:
    scanner_mode:
      type: "select"
      default: "scan_yourself"
